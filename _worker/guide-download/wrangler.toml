name = "guide-download"
main = "src/index.js"
compatibility_date = "2026-11-01"

# Serve the Worker on its own subdomain, e.g. guide.nikolmakeup.cz
# (needs the domain on Cloudflare; otherwise remove this and use the *.workers.dev URL).
# routes = [{ pattern = "guide.nikolmakeup.cz", custom_domain = true }]

[[r2_buckets]]
binding = "GUIDES"
bucket_name = "nikol-guides"

[vars]
SITE_URL = "https://nikolmakeup.cz"
MAX_AGE_DAYS = "30"
# Stripe Price ID -> PDF in the R2 bucket: CZ 499 CZK, EN 19 EUR, UA 699 UAH (live prices).
FILES = '{"price_1UfgesQrGQt4iD22GFN3peQB": {"key": "brush-guide-cs.pdf", "name": "Pruvodce-stetci-Nikol-Pavlova.pdf"}, "price_1UfgjSQrGQt4iD22x2kbxvAH": {"key": "brush-guide-en.pdf", "name": "Makeup-Brush-Guide-Nikol-Pavlova.pdf"}, "price_1UfgPHQrGQt4iD22gW5ZzlRi": {"key": "brush-guide-uk.pdf", "name": "Gaid-po-penzlykakh-Nikol-Pavlova.pdf"}}'

# Secret (not in this file):  npx wrangler secret put STRIPE_SECRET_KEY
